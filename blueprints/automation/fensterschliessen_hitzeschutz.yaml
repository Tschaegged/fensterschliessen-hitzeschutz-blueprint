blueprint:
  name: Fenster schließen – Hitzeschutz-Benachrichtigung
  source_url: https://github.com/Tschaegged/fensterschliessen-hitzeschutz-blueprint/blob/main/blueprints/automation/fensterschliessen_hitzeschutz.yaml
  description: >
    Sendet eine Benachrichtigung wenn die Außentemperatur über einem Schwellenwert liegt
    UND wärmer als der Durchschnitt der gewählten Innenraum-Sensoren ist.
    Räume für den Durchschnitt sind frei wählbar (Mehrfachauswahl).
  domain: automation
  author: Claude
  input:
    outdoor_sensor:
      name: Außentemperatursensor
      description: Sensor für die aktuelle Außentemperatur
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outdoor_threshold:
      name: Mindest-Außentemperatur (°C)
      description: Benachrichtigung nur wenn Außentemperatur über diesem Wert liegt
      default: 22
      selector:
        number:
          min: 15
          max: 45
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    indoor_sensors:
      name: Innenraum-Temperatursensoren
      description: >
        Wähle die Räume, die für den Temperatur-Durchschnitt berücksichtigt werden sollen.
        Mehrfachauswahl möglich.
      selector:
        entity:
          multiple: true
          domain: sensor
          device_class: temperature

    window_sensor:
      name: Fenster-/Türen-Sensor
      description: Binärsensor der anzeigt ob Fenster oder Türen geöffnet sind
      selector:
        entity:
          domain: binary_sensor

    persons:
      name: Personen (Anwesenheitsprüfung)
      description: >
        Benachrichtigung nur wenn mindestens eine dieser Personen zu Hause ist.
        Leer lassen um die Prüfung zu überspringen.
      default: []
      selector:
        entity:
          multiple: true
          domain: person

    notify_actions:
      name: Benachrichtigungsaktionen
      description: >
        Aktionen die ausgeführt werden sollen (z.B. notify.mobile_app_...).
        Mehrere Empfänger können hier nacheinander eingetragen werden.
      selector:
        action: {}

variables:
  outdoor_sensor: !input outdoor_sensor
  outdoor_threshold: !input outdoor_threshold
  indoor_sensors: !input indoor_sensors
  persons: !input persons

triggers:
  - trigger: template
    value_template: >
      {% set outdoor = states(outdoor_sensor) | float(-99) %}
      {% if outdoor < outdoor_threshold %}
        false
      {% else %}
        {% set ns = namespace(total=0, count=0) %}
        {% for s in indoor_sensors %}
          {% set val = states(s) | float(none) %}
          {% if val is not none %}
            {% set ns.total = ns.total + val %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
        {% endfor %}
        {% if ns.count > 0 %}
          {{ outdoor > ns.total / ns.count }}
        {% else %}
          false
        {% endif %}
      {% endif %}
    for: "00:05:00"

conditions:
  - condition: state
    entity_id: !input window_sensor
    state: "on"
  - condition: template
    value_template: >
      {% if persons | length == 0 %}
        true
      {% else %}
        {{ persons | map('states') | select('eq', 'home') | list | length > 0 }}
      {% endif %}

actions: !input notify_actions

mode: single
